name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilation
        run: |
          cmake -B build -DSFML_DEPUIS_SOURCES=ON
          cmake --build build --config Release

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory JeuxDesCases | Out-Null
          Copy-Item build/Release/JeuxDesCases.exe JeuxDesCases/
          Copy-Item -Recurse niveaux JeuxDesCases/

      - uses: actions/upload-artifact@v4
        with:
          name: JeuxDesCases-windows
          path: JeuxDesCases
